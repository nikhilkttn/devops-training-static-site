name: Deploy Static Site

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Debug OIDC claims
        run: |
          echo "OIDC request URL is available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token is available: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::771336636724:role/github-actions-static-site-deploy
          aws-region: ap-south-1

      - name: Deploy to S3
        run: aws s3 sync dist s3://devops-training-static-site-nikhil-2026 --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1I55GMFDCHMAT \
            --paths "/*"
