name: Deploy Static Site

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      # Debug GitHub OIDC claims
      - name: Debug GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("");
            console.log("==============================================");
            console.log("       GITHUB OIDC DEBUG INFORMATION");
            console.log("==============================================");

            console.log("Issuer (iss):");
            console.log(payload.iss);

            console.log("");
            console.log("Audience (aud):");
            console.log(payload.aud);

            console.log("");
            console.log("Subject (sub):");
            console.log(payload.sub);

            console.log("");
            console.log("Repository:");
            console.log(payload.repository);

            console.log("");
            console.log("Repository Owner:");
            console.log(payload.repository_owner);

            console.log("");
            console.log("Repository Owner ID:");
            console.log(payload.repository_owner_id);

            console.log("");
            console.log("Repository ID:");
            console.log(payload.repository_id);

            console.log("");
            console.log("Ref:");
            console.log(payload.ref);

            console.log("");
            console.log("SHA:");
            console.log(payload.sha);

            console.log("");
            console.log("Event Name:");
            console.log(payload.event_name);

            console.log("");
            console.log("Workflow:");
            console.log(payload.workflow);

            console.log("");
            console.log("Workflow Ref:");
            console.log(payload.workflow_ref);

            console.log("");
            console.log("Job Workflow Ref:");
            console.log(payload.job_workflow_ref);

            console.log("");
            console.log("Actor:");
            console.log(payload.actor);

            console.log("");
            console.log("Actor ID:");
            console.log(payload.actor_id);

            console.log("");
            console.log("Run ID:");
            console.log(payload.run_id);

            console.log("");
            console.log("Run Number:");
            console.log(payload.run_number);

            console.log("");
            console.log("Environment:");
            console.log(payload.environment);

            console.log("");
            console.log("==============================================");
            console.log("       EXPECTED AWS TRUST POLICY");
            console.log("==============================================");

            console.log("");
            console.log("OIDC Provider:");
            console.log(
              "arn:aws:iam::771336636724:oidc-provider/token.actions.githubusercontent.com"
            );

            console.log("");
            console.log("Expected Audience:");
            console.log("sts.amazonaws.com");

            console.log("");
            console.log("Expected Subject for main branch:");
            console.log(
              `repo:${payload.repository}:ref:refs/heads/main`
            );

            console.log("");
            console.log("==============================================");

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::771336636724:role/github-actions-static-site-deploy
          aws-region: ap-south-1

      # Verify that AWS STS successfully assumed the role
      - name: Verify AWS Identity
        run: |
          echo "=============================================="
          echo "             AWS IDENTITY"
          echo "=============================================="

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          aws configure get region

          echo "=============================================="

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://devops-training-static-site-nikhil-2026 --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1I55GMFDCHMAT \
            --paths "/*"
