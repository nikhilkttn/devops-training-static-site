name: Deploy Static Site

on:
  push:
    branches:
      - main

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------
      # 4. Run tests
      # --------------------------------------------
      - name: Run tests
        run: npm test

      # --------------------------------------------
      # 5. Build application
      # --------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------
      # 6. Debug GitHub OIDC Token
      # --------------------------------------------
      # This prints OIDC claims only.
      # DO NOT print the actual JWT token.
      # --------------------------------------------
      - name: Debug GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("");
            console.log("==============================================");
            console.log("       GITHUB OIDC DEBUG INFORMATION");
            console.log("==============================================");

            console.log("");
            console.log("Issuer (iss):");
            console.log(payload.iss);

            console.log("");
            console.log("Audience (aud):");
            console.log(payload.aud);

            console.log("");
            console.log("Subject (sub):");
            console.log(payload.sub);

            console.log("");
            console.log("Repository:");
            console.log(payload.repository);

            console.log("");
            console.log("Repository Owner:");
            console.log(payload.repository_owner);

            console.log("");
            console.log("Repository Owner ID:");
            console.log(payload.repository_owner_id);

            console.log("");
            console.log("Repository ID:");
            console.log(payload.repository_id);

            console.log("");
            console.log("Ref:");
            console.log(payload.ref);

            console.log("");
            console.log("SHA:");
            console.log(payload.sha);

            console.log("");
            console.log("Event Name:");
            console.log(payload.event_name);

            console.log("");
            console.log("Workflow:");
            console.log(payload.workflow);

            console.log("");
            console.log("Workflow Ref:");
            console.log(payload.workflow_ref);

            console.log("");
            console.log("Job Workflow Ref:");
            console.log(payload.job_workflow_ref);

            console.log("");
            console.log("Actor:");
            console.log(payload.actor);

            console.log("");
            console.log("Actor ID:");
            console.log(payload.actor_id);

            console.log("");
            console.log("Run ID:");
            console.log(payload.run_id);

            console.log("");
            console.log("Run Number:");
            console.log(payload.run_number);

            console.log("");
            console.log("Environment:");
            console.log(payload.environment);

            console.log("");
            console.log("==============================================");
            console.log("       EXPECTED AWS TRUST POLICY");
            console.log("==============================================");

            console.log("");
            console.log("OIDC Provider:");
            console.log(
              "arn:aws:iam::771336636724:oidc-provider/token.actions.githubusercontent.com"
            );

            console.log("");
            console.log("Expected Audience:");
            console.log("sts.amazonaws.com");

            console.log("");
            console.log("Expected Subject:");
            console.log(
              `repo:${payload.repository_owner}@${payload.repository_owner_id}/${payload.repository}@${payload.repository_id}:ref:${payload.ref}`
            );

            console.log("");
            console.log("==============================================");

      # --------------------------------------------
      # 7. Configure AWS credentials using OIDC
      # --------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::771336636724:role/github-actions-static-site-deploy
          aws-region: ap-south-1

      # --------------------------------------------
      # 8. Verify AWS identity
      # --------------------------------------------
      # Do NOT use "aws configure get region" here.
      # configure-aws-credentials sets AWS_REGION and
      # AWS_DEFAULT_REGION as environment variables.
      # --------------------------------------------
      - name: Verify AWS Identity
        run: |
          echo "=============================================="
          echo "             AWS IDENTITY"
          echo "=============================================="

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "AWS Default Region:"
          echo "$AWS_DEFAULT_REGION"

          echo "=============================================="

      # --------------------------------------------
      # 9. Deploy static files to S3
      # --------------------------------------------
      - name: Deploy to S3
        run: |
          echo "=============================================="
          echo "             S3 DEPLOYMENT"
          echo "=============================================="

          aws s3 sync \
            dist/ \
            s3://devops-training-static-site-nikhil-2026 \
            --delete

          echo "S3 deployment completed successfully."

      # --------------------------------------------
      # 10. Invalidate CloudFront cache
      # --------------------------------------------
      - name: Invalidate CloudFront cache
        run: |
          echo "=============================================="
          echo "        CLOUDFRONT INVALIDATION"
          echo "=============================================="

          aws cloudfront create-invalidation \
            --distribution-id E1I55GMFDCHMAT \
            --paths "/*"

          echo "CloudFront invalidation requested successfully."

          echo "=============================================="

